<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Alinhamento | Align content</title>
   <style>
      body{
         background-color: black;
         
      }
      h1, h2, h3{
         color: white;
         text-align: center;

      }
      .container-flex{
        
         border: 4px solid red;
         display: flex;
         flex-direction: row;
         justify-content: center;
         align-items: center;
         flex-wrap: wrap;
         margin: 0 auto;
         gap: 10px;

      }
      .container-flex > div{
        
         border: 4px solid white;
         padding: 4px;
         margin: 4px;
         color: white;
         flex-basis: 80px;
         padding: 10px;
      }
      .coluna{
         flex-direction: column;
         
      }
      .item{
         align-self:flex-start;
      }
      .item1, .item4{
         flex: 1 1 200px
        
         
      }
      
      
      .item2, .item3{
         flex: 2 2 200px
      }
      .row{
         
      }
      
      
     
   </style>
</head>
<body>
   <h1>display Flex</h1>
   <h2>align self</h2>
   <h3>row</h3>
   <div class="container-flex row" >
      <div class="item1">Item texte 01</div>
      <div class="item2">Item texte 02</div>
      <div class="item3">Item texte 03</div>
      <div class="item3">Item texte 04</div>
   </div> 
   
   <h3>column</h3>
   <div class="container-flex coluna">
       
      <div class="item1">Item texte 01</div>
      <div class="item2">Item texte 02</div>
      <div class="item3">Item texte 03</div>
      <div class="item3">Item texte 04</div>
   </div> 
   
  


   
</body>
</html>
