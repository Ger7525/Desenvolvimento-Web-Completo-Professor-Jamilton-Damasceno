<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Alinhamentos | Align Itens</title>
   <style>
      body{
         background-color: black;
      }
      h1, h2{
         color: white;
         text-align: center;
      }
      
      .container-flex{
         height: 250px;
         border: 4px solid red;
         display: flex;
         flex-direction: row;
         justify-content: center;
         align-items: flex-start;
         

      }
      .container-flex > div{
         border: 4px solid white;
         padding: 4px;
         margin: 4px;
         color: white;
      }
      .texto-grande{
         font-size: 3em;
      }
      .coluna{
         flex-direction: column;
         align-items: flex-start;
      }
   </style>
</head>
<body>
   <h1>Alinhamento | align itens</h1>
   <h2>row</h2>
   <div class="container-flex">
      <div>01</div>
      <div class="texto-grande">02</div>
      <div>03</div>
     <!--   <div>04</div>
    <div>05</div>
      <div>06</div>
      <div>07</div>
      <div>08</div>
      <div>09</div>
      <div>10</div>-->

   </div>
    <h2>column</h2>
   <div class="container-flex coluna">
      <div>01</div>
      <div class="texto-grande">02</div>
      <div>03</div>

   
</body>
</html>
