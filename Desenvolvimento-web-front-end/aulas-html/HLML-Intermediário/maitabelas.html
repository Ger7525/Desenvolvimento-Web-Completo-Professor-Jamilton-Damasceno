<!DOCTYPE html>
<html lang="pt-BR">
<head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>mais Tabelas</title>
                    <style>
                       }                 
                    </style>
</head>
<body>
                    <h1>Mais Tabelas</h1>
                    <!--
                    caption -> Legenda / título da tabela
                    theader -> Table Header ( cabeçalho da tabela)
                    Tbody -> Table Body (corpo da tabela)
                    tfoot -> Table Footer (rodapé da tabela)                 
                     -->
                    <table border="1"
                        <caption>
                           Listagem de produtos             
                        </caption>
                        <thead>
                            <tr>
                               <th>Produtos</th>
                               <th>Quantidade</th>
                               <th>Preço</th>
                            </tr>            
                        </thead>
                        <tbody>
                           <tr>
                              <td>Notebook</td>
                              <td>1</td>
                              <td>2000</td>          
                           </tr>
                           <tr>
                               <td>Tabtlet</td>
                               <td>2</td>
                               <td>1000</td>         
                           </tr>             
                        </tbody>
                        <tfoot>
                           <tr>
                              <td colspan="2">Total</td>
                              <td>3000</td>
                           </tr>

                        </tfoot>

                    </table>
                    
</body>
</html>
