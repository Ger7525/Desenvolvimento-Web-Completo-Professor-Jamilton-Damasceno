<!DOCTYPE html>
<html lang="pt-BR">
<head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Posicionamento</title>
                    <style>
                                        .caixa-1{
                                                            border: 1px solid blue;
                                                            background-color: lightblue;
                                                            width: 100px;
                                                            height: 100px;
                                                            position: relative;
                                                            top: 10px;
                                                            left: 40px;
                                                            z-index: 3;
                                        }
                                        .caixa-2{
                                                            border: 1px solid red;
                                                            background-color: lightcoral;
                                                            width: 100px;
                                                            height: 100px;
                                                            position: relative;
                                                            top: -50px;
                                                            left: 70px;
                                                            z-index: 2;
                                        }
                                        .caixa-3{
                                                            border: 1px solid green;
                                                            background-color: lightgreen;
                                                            width: 100px;
                                                            height: 100px;
                                                            position: relative;
                                                            top:-100px;
                                                            left: 100px;
                                                            z-index: 1;
                                        }
                    </style>
</head>
<body>
                    <div class="caixa-1">
                                        caixa 1
                    </div>

                    <div class="caixa-2">
                                        caixa 2
                    </div>

                    <div class="caixa-3">
                                        caixa 3
                    </div>
                    
</body>
</html>
