<!DOCTYPE html>
<html lang="pt-BR">
<head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>desafio menu</title>
                    <style>
                       ul{
                                        display: flex;
                                        gap: 20px;
                                        flex-flow: row wrap;
                                        justify-content: center;
                                        align-items: center;
                                        align-content: center;
                                        list-style: none;
                       } 
                       ul>li>a{
                                        text-decoration: none;
                                        font-weight: bold;
                                        color: purple;
                                        padding: 1em 2em;
                       } 
                       ul>li>a:hover{
                                        background-color: purple;
                                        color: white;
                       } 
                       ul>li>a:active{
                                        color: red;
                                        font-size: 2em;
                       }              
                    </style>
</head>
<body>
                    <nav>
                       <ul>
                                        <li><a href="">Home</a></li> |
                                        <li><a href="">Sobre</a></li>|
                                        <li><a href="">Empresa</a></li> |
                                        <li><a href="">Produtos</a></li> |
                                        <li><a href="">Contato</a></li> 
                       </ul>                 
                    </nav>
                    
</body>
</html>
