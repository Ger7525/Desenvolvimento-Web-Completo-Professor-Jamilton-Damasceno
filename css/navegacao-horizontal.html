<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Navegação Hotizontal</title>
   <style>
      body{
         background-color: aliceblue;
      }
      h1{
         color: rgb(35, 35, 70);
      }
      #menu{
         background-color:rgb(35, 35, 70) ;
         padding: 20px;
         width: 70%;
      }
      #menu a{
         color: white;
         margin: 30px;
         padding: 10px 30px;
         text-decoration: none;
         font-weight: bold;
         font-size: 1.3em;
         border-radius: 20px;
         transition: all 0.3s;
      }
      #menu a:hover{
         background-color: rgb(139, 139, 212);
      }
      #menu a:active{
         background-color: orange;
         color:rgb(35, 35, 70) ;
        
      }
      #menu #destaque{
         background-color: orange;
      }
      #menu #destaque:hover{
         background-color:none ;
      }
      #conteudo{
         width: 70%;
      }
      h2{
         color: rgb(35, 35, 70);
      }
      p{
         color: rgb(35, 35, 70);
      }
   </style>
</head>
<body>
   <h1>Menu de navegação horizoltal</h1>
   <div id="menu">
      <a href="" id="destaque">Home</a>
      <a href="">Produtos</a>
      <a href="">Carrinho</a>
      <a href="">Contato</a>
      
   </div>

   <div id="conteudo">
      <h2>Conteúdo</h2>
      <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Velit optio autem ut a? Earum magnam facere odit labore totam, illo quia, aspernatur corrupti, nulla ratione quaerat consequatur qui fugit. Vel.</p>
      
   </div>
</body>
</html>
