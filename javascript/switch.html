<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>switch</title>
</head>
<body>
   <script>
      
      var paramento = prompt('digite um numero')
      paramento = parseInt(paramento)
         switch (paramento){

            case 1:
               document.write('Paramento 1')
               break
            case 2:
               document.write('Paramento 2')
               break
            default:
               document.write('Default')   


         }


   </script>
   
</body>
</html>
