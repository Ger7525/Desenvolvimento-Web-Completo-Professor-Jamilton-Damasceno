   <title>Operadores Condicionais</title>
 </head>
 <body>
   <script>
    alert('Bem vindo a escola da Macumba')
    alert('Digite as Três notas principais do aluno para Obter a media')
    var nome = prompt('Digite o nome do aluno : ')
    var nota1 = prompt('Digite a primeira nota')
    var nota2 = prompt('Digite a Segunda nota')
    var nota3 = prompt('Digite a Terceira nota')
    nota1=parseFloat(nota1)
    nota2=parseFloat(nota2)
    nota3=parseFloat(nota3)
    var media =(nota1 + nota2 + nota3) / 3 

    document.write('A média do aluno: '+nome+ ' é ' + media + 'pontos <br/>')

    if(media >= 7){
      document.write('O Aluno esta Aprovado')
    }
    else{
      document.write('O Aluno esta Reprovado')
    }
