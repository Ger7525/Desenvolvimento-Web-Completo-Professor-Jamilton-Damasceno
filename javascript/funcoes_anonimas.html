<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Funções Anônimas</title>
</head>
<body>
   <script>
      var exibirSaudacao = function(nome) {
         // Função anônima
         document.write('Olá ' + nome + ', tudo bem?')
      }

      exibirSaudacao('Lucas');

   </script>
   
</body>
</html>
