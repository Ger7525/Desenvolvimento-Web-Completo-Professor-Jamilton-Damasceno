<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Desafio 001</title>
    <script>
      var a = 10
      var b = 20
      var c = null // variável auxiliar utilizada na logica.

      ducument.write('<p>A: '+ a + '</p><br />')
      ducument.write('B: '+ b + '<br />')
      ducument.write('C: '+ c + '<br />')

      ducument.write('<hr />')

     // lógica de inversão dos valores das variáveis
      ducument.write('A: '+ a + '<br />')
      ducument.write('B: '+ b + '<br />')
      ducument.write('C: '+ c + '<br />')

      c=a
      a=b
      b=c
      c=null

      ducument.write('A: '+ a + '<br />')
      ducument.write('B: '+ b + '<br />')
      ducument.write('C: '+ c + '<br />')



   </script>
