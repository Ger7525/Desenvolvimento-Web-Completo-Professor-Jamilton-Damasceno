<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Funções Callback</title>
</head>
<body>
   <script>
      function exibirartigo(id, callbackSucesso, callbackErro) {
         // lógica: recuperar o id via requisiçao http
        if(true){
         callbackSucesso('Funções de callback em javascript', 'Funções de callback são funções passadas como parâmetro para outras funções, que serão executadas após algum tipo de evento ou ação. Elas são muito utilizadas em operações assíncronas, como requisições HTTP, para garantir que o código seja executado na ordem correta.');
        }else{
         callbackErro('Artigo não encontrado');
        } 
      }
      var callbackSucesso = function(titulo, descricao){
         document.write('<h1>' + titulo + '</h1>');
         document.write('<hr/>');
         document.write('<p>' + descricao + '</p>');
      }
      var callbackErro= function(erro){
         document.write('<h1>' + erro + '</h1>');

      }
      exibirArtigo(1, callbackSucesso, callbackErro);


   </script>
   
</body>
</html>
