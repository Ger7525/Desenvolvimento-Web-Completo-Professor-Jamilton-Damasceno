 <!DOCTYPE html>
 <html lang="pt-BR">
 <head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Operadores Condicionais</title>
 </head>
 <body>
   <script>
    
    var nome = prompt('digite seu nome')
    var altura = prompt('Ola ' + nome + ' Qual é a sua Altura?' )
    var peso = prompt('Agora '+nome+  ' digite  o seu peso ')
    altura = parseFloat(altura)
    peso= parseFloat(peso)
    var imc = peso / (altura* altura) 
     document.write('<h1 style="color:#666">O  IMC de  ' + nome + '  é : '+imc+ ' de massa</h1>')
     imc=parseInt(imc)
 
 
 
 
 
 
 
 
 
    if(imc < 18.5 ){
         document.write('<h6>Você esta abaixo do peso normal</h6>')
      }
      else if(imc >=18.5 && imc <=24.9){
         document.write('<h5>Você esta no peso normal</h5>')
      }
      else if(imc >=25.0 && imc <=29.9){
         document.write('<h4>Você esta com Exceso de peso</h4>')
      }
      else if(imc >=30.0 && imc <=34.9){
         document.write('<h3>Você esta com obesidade I</h3>')
      }
      else if(imc >=35.0 && imc <=39.9){
         document.write('<h2>Você esta com obesidade II</h2>')
      }
      else{
        document.write('<h1>você esta com obesidade II</h1>')
      }
   </script>
   
 </body>
 </html>
