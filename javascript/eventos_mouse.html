<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>eventos do mouse</title>
   <script>
      
      function acao1(){
         alert('Elemento foi clicado')
      }

       function acao2(){
         alert('o curso do mouse deixou a area')
      }
   </script>
</head>
<body>
   
   
   
   
   <div onclick="acao1()" ondblclick="acao2()" style="background-color: #ccc; width: 150px; height: 150px;"></div>

   
   </body>
</html>
